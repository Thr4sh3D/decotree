<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Christmas Tree Decorating — Mini Game</title>
<style>
  html,body { height:100%; margin:0; }
  body { background:#eaf6ff; /* very light blue - snowy day */ display:flex; align-items:stretch; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  canvas { display:block; width:100%; height:100%; touch-action: none; }
  .info {
    position: fixed; left:12px; top:12px;
    background: rgba(255,255,255,0.88); padding:8px 10px; border-radius:8px;
    font-size:14px; color:#0b3a4a;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    user-select:none;
  }
  /* Glossy red holiday button top-right */
  #resetBtn {
    position: fixed;
    right: 12px;
    top: 12px;
    padding: 8px 14px;
    background: linear-gradient(180deg, #ff5a5a 0%, #d91f2a 60%, #b21016 100%);
    border: 1px solid rgba(0,0,0,0.15);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 18px;
    box-shadow: 0 4px 10px rgba(183, 28, 28, 0.25), inset 0 -2px 0 rgba(0,0,0,0.08);
    cursor: pointer;
    user-select: none;
  }
  #resetBtn:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="info" id="info">Ornaments on tree: 0</div>
<button id="resetBtn" aria-label="Rensa Granen">Rensa Granen</button>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const info = document.getElementById('info');
  const resetBtn = document.getElementById('resetBtn');

  let DPR = Math.max(1, window.devicePixelRatio || 1);

  function resizeCanvas() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    const w = Math.max(300, innerWidth);
    const h = Math.max(300, innerHeight);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
  }

  window.addEventListener('resize', resizeCanvas, { passive: true });

  // Game layout parameters (relative)
  let W=innerWidth, H=innerHeight;
  let cx, cy;
  // tree now contains tiers array (3 triangles) and trunk rect
  let tree = { tiers: [], trunk: {}, width:0, height:0 };
  let player = { x:0, y:0, w:80, h:18, color:'#4d2' };
  const ornaments = [];
  const palette = ['#e63946','#ffb703','#fb8500','#8338ec','#3a86ff','#7bd389','#ff6bcb'];

  function computeLayout() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    cx = W / 2;
    cy = H / 2.2; // tree center reference
    tree.height = Math.min(H * 0.6, W * 0.6);
    tree.width = tree.height * 0.9;

    // We'll compute three tiers so their edges overlap without gaps.
    // Tier heights: relative distribution
    const total = tree.height;
    const h1 = total * 0.28; // top
    const h2 = total * 0.36; // middle
    const h3 = total * 0.36; // bottom

    // Start top apex
    const topApexY = cy - total * 0.5;

    // Top tier
    const top = {
      v1: { x: cx, y: topApexY }, // apex
      v2: { x: cx - tree.width * 0.28, y: topApexY + h1 }, // left base
      v3: { x: cx + tree.width * 0.28, y: topApexY + h1 }, // right base
      color: '#0fb24b'
    };

    // Middle apex should be placed slightly above the top tier base so they overlap
    const overlap = Math.min(h1, h2) * 0.35;
    const midApexY = top.v2.y - overlap;
    const middle = {
      v1: { x: cx, y: midApexY },
      v2: { x: cx - tree.width * 0.45, y: midApexY + h2 },
      v3: { x: cx + tree.width * 0.45, y: midApexY + h2 },
      color: '#0a8a2f'
    };

    // Bottom apex placed to overlap middle base
    const overlap2 = Math.min(h2, h3) * 0.35;
    const botApexY = middle.v2.y - overlap2;
    const bottom = {
      v1: { x: cx, y: botApexY },
      v2: { x: cx - tree.width * 0.6, y: botApexY + h3 },
      v3: { x: cx + tree.width * 0.6, y: botApexY + h3 },
      color: '#087023'
    };

    tree.tiers = [top, middle, bottom];

    // Trunk must sit exactly at the bottom base of the lowest triangle
    const bottomBaseY = Math.max(bottom.v2.y, bottom.v3.y); // base line y coordinate
    const trunkW = tree.width * 0.16;
    const trunkH = Math.max(24, tree.height * 0.12);
    tree.trunk = {
      x: cx - trunkW * 0.5,
      y: bottomBaseY,
      w: trunkW,
      h: trunkH
    };

    player.w = Math.max(48, W * 0.12);
    player.h = Math.max(12, H * 0.03);
    player.y = H - player.h - 24;
    if (!player.x) player.x = cx;
  }

  function clear() {
    ctx.fillStyle = '#eaf6ff';
    ctx.fillRect(0,0,W,H);
  }

  function drawTree() {
    // subtle shadow under each tier
    for (let i = 0; i < tree.tiers.length; i++) {
      const t = tree.tiers[i];
      ctx.beginPath();
      ctx.moveTo(t.v1.x, t.v1.y + 6);
      ctx.lineTo(t.v2.x, t.v2.y + 6);
      ctx.lineTo(t.v3.x, t.v3.y + 6);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fill();
    }

    // draw tiers bottom-to-top for proper overlap
    for (let i = tree.tiers.length - 1; i >= 0; i--) {
      const t = tree.tiers[i];
      ctx.beginPath();
      ctx.moveTo(t.v1.x, t.v1.y);
      ctx.lineTo(t.v2.x, t.v2.y);
      ctx.lineTo(t.v3.x, t.v3.y);
      ctx.closePath();
      ctx.fillStyle = t.color;
      ctx.fill();

      // subtle trim/highlight
      ctx.beginPath();
      const inset = Math.min(tree.width, tree.height) * 0.03;
      ctx.moveTo(t.v1.x, t.v1.y + inset);
      ctx.lineTo(t.v2.x + inset, t.v2.y - inset);
      ctx.lineTo(t.v3.x - inset, t.v3.y - inset);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fill();
    }

    // draw trunk directly at bottom base (no floating)
    ctx.fillStyle = '#6b3b1b';
    ctx.fillRect(tree.trunk.x, tree.trunk.y, tree.trunk.w, tree.trunk.h);
  }

  // Draw a 5-point star centered at (x,y)
  function drawStar(x, y, radius = 18, color = '#ffd700') {
    const spikes = 5;
    const outer = radius;
    const inner = radius * 0.48;
    let rot = Math.PI / 2 * 3;
    let cx = x;
    let cy = y;
    ctx.save();
    // soft glow
    ctx.shadowColor = 'rgba(255,220,80,0.9)';
    ctx.shadowBlur = Math.max(8, radius * 0.9);
    ctx.beginPath();
    ctx.moveTo(cx, cy - outer);
    for (let i = 0; i < spikes; i++) {
      const ox = cx + Math.cos(rot) * outer;
      const oy = cy + Math.sin(rot) * outer;
      ctx.lineTo(ox, oy);
      rot += Math.PI / spikes;

      const ix = cx + Math.cos(rot) * inner;
      const iy = cy + Math.sin(rot) * inner;
      ctx.lineTo(ix, iy);
      rot += Math.PI / spikes;
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();

    // small bright center
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.arc(cx, cy, Math.max(2, radius * 0.14), 0, Math.PI*2);
    ctx.fill();
  }

  // Draw Santa-like player (unchanged from previous)
  function drawPlayer() {
    const cxp = player.x;
    const baseline = player.y + player.h; // feet baseline (unused but for reference)
    const headR = Math.max(10, player.h * 1.6);
    const headX = cxp;
    const headY = player.y - headR - 6;

    // body (simple rounded triangle/dress)
    ctx.save();
    ctx.translate(headX, headY + headR * 0.8);

    const bodyW = player.w * 0.9;
    const bodyH = player.h * 3.6;
    ctx.beginPath();
    ctx.moveTo(-bodyW*0.45, 0);
    ctx.quadraticCurveTo(-bodyW*0.25, bodyH*0.5, 0, bodyH);
    ctx.quadraticCurveTo(bodyW*0.25, bodyH*0.5, bodyW*0.45, 0);
    ctx.closePath();
    ctx.fillStyle = '#d92a2a';
    ctx.fill();

    // white trim at bottom
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.ellipse(0, bodyH - Math.max(6, player.h*0.3), bodyW*0.45, Math.max(8, player.h*0.45), 0, 0, Math.PI);
    ctx.fill();

    ctx.restore();

    // head
    ctx.beginPath();
    ctx.fillStyle = '#ffd8b6';
    ctx.arc(headX, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.beginPath();
    ctx.fillStyle = '#222';
    ctx.arc(headX - headR*0.28, headY - headR*0.08, Math.max(1.6, headR*0.12), 0, Math.PI*2);
    ctx.arc(headX + headR*0.28, headY - headR*0.08, Math.max(1.6, headR*0.12), 0, Math.PI*2);
    ctx.fill();

    // mouth (smile)
    ctx.beginPath();
    ctx.strokeStyle = '#7a2a2a';
    ctx.lineWidth = Math.max(1, headR*0.08);
    ctx.beginPath();
    ctx.arc(headX, headY + headR*0.12, headR*0.32, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    // hat - red cone/triangle
    ctx.beginPath();
    ctx.moveTo(headX - headR*0.9, headY - headR*0.6);
    ctx.quadraticCurveTo(headX, headY - headR - headR*0.5, headX + headR*1.1, headY - headR*0.2);
    ctx.lineTo(headX + headR*0.85, headY - headR*0.2);
    ctx.quadraticCurveTo(headX + headR*0.35, headY - headR*0.6, headX - headR*0.6, headY - headR*0.5);
    ctx.closePath();
    ctx.fillStyle = '#d92a2a';
    ctx.fill();

    // hat brim (white)
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.ellipse(headX, headY - headR*0.15, headR*1.02, headR*0.36, 0, 0, Math.PI*2);
    ctx.fill();

    // pompom
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(headX + headR*1.06, headY - headR*0.16, Math.max(4, headR*0.28), 0, Math.PI*2);
    ctx.fill();
  }

  function drawOrnaments() {
    for (const o of ornaments) {
      // radial gradient for 3D effect
      const lx = o.x - o.r*0.35;
      const ly = o.y - o.r*0.45;
      const g = ctx.createRadialGradient(lx, ly, Math.max(1, o.r*0.15), o.x, o.y, o.r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.15, lighten(o.color, 0.25));
      g.addColorStop(0.6, o.color);
      g.addColorStop(1, darken(o.color, 0.25));

      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fill();

      // small bright specular highlight
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.arc(lx, ly, Math.max(1.5, o.r*0.28), 0, Math.PI*2);
      ctx.fill();

      // hook
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(40,40,40,0.85)';
      ctx.lineWidth = Math.max(1, o.r*0.12);
      ctx.moveTo(o.x, o.y - o.r - 1);
      ctx.lineTo(o.x, o.y - o.r - Math.max(4, o.r*0.6));
      ctx.stroke();
    }
  }

  // small color helpers to lighten/darken hex colors (returns rgba string)
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    const bigint = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return { r, g, b };
  }
  function lighten(hex, amt) {
    const c = hexToRgb(hex);
    const r = Math.min(255, Math.round(c.r + (255 - c.r) * amt));
    const g = Math.min(255, Math.round(c.g + (255 - c.g) * amt));
    const b = Math.min(255, Math.round(c.b + (255 - c.b) * amt));
    return `rgba(${r},${g},${b},1)`;
  }
  function darken(hex, amt) {
    const c = hexToRgb(hex);
    const r = Math.max(0, Math.round(c.r * (1 - amt)));
    const g = Math.max(0, Math.round(c.g * (1 - amt)));
    const b = Math.max(0, Math.round(c.b * (1 - amt)));
    return `rgba(${r},${g},${b},1)`;
  }

  // barycentric / sign method to check if point is inside triangle
  function pointInTriangle(pt, a, b, c) {
    const sign = (p1,p2,p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
    const d1 = sign(pt, a, b);
    const d2 = sign(pt, b, c);
    const d3 = sign(pt, c, a);
    const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
    const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
    return !(hasNeg && hasPos);
  }

  function throwOrnament(targetX, targetY) {
    // origin is center top of player visual
    const originX = player.x;
    const originY = player.y;
    const dx = targetX - originX;
    const dy = targetY - originY;
    const len = Math.hypot(dx, dy) || 1;
    const speed = Math.max(5, Math.min(20, Math.hypot(W,H) / 80));
    const vx = (dx / len) * speed;
    const vy = (dy / len) * speed;
    const color = palette[Math.floor(Math.random() * palette.length)];
    const r = Math.max(6, Math.min(14, Math.round(Math.min(W,H) / 60 * (0.8 + Math.random()*0.6))));
    ornaments.push({ x: originX, y: originY, vx, vy, r, color, stuck:false });
  }

  // Remove ornaments that fell off-screen far away, but keep stuck ones
  function pruneOrnaments() {
    for (let i = ornaments.length - 1; i >= 0; i--) {
      const o = ornaments[i];
      if (o.stuck) continue;
      if (o.x < -100 || o.x > W + 100 || o.y < -200 || o.y > H + 200) {
        ornaments.splice(i,1);
      }
    }
  }

  // update physics and check collisions
  function update(delta) {
    for (const o of ornaments) {
      if (o.stuck) continue;
      o.x += o.vx * (delta / 16.67);
      o.y += o.vy * (delta / 16.67);

      // CRITICAL: check collision against ALL tiers
      let stuckNow = false;
      for (const t of tree.tiers) {
        if (pointInTriangle({x:o.x, y:o.y}, t.v1, t.v2, t.v3)) {
          stuckNow = true;
          break;
        }
      }
      if (stuckNow) {
        o.stuck = true;
        o.vx = 0; o.vy = 0;
        // nudge out a bit from tree center for nicer placement
        const treeCenter = { x: cx, y: cy + tree.height * 0.06 };
        const nx = o.x - treeCenter.x;
        const ny = o.y - treeCenter.y;
        const nlen = Math.hypot(nx, ny) || 1;
        const push = o.r * 0.2;
        o.x += (nx/nlen) * push;
        o.y += (ny/nlen) * push;
      }
    }
    pruneOrnaments();
  }

  function render() {
    clear();
    drawTree();
    // draw star at apex of top triangle
    if (tree.tiers && tree.tiers.length > 0) {
      const apex = tree.tiers[0].v1;
      drawStar(apex.x, apex.y, Math.max(12, tree.width * 0.035));
    }
    drawOrnaments();
    drawPlayer();
    info.textContent = 'Ornaments on tree: ' + ornaments.filter(o => o.stuck).length;
  }

  // Input handling: coordinates conversion helper
  function toCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width) / DPR;
    const y = (clientY - rect.top) * (canvas.height / rect.height) / DPR;
    return { x, y };
  }

  // Mouse controls (kept exactly as original)
  let isPointerDown = false;
  window.addEventListener('mousemove', (e) => {
    const p = toCanvasCoords(e.clientX, e.clientY);
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, p.x));
  }, { passive: true });

  window.addEventListener('mousedown', (e) => {
    isPointerDown = true;
    const p = toCanvasCoords(e.clientX, e.clientY);
    throwOrnament(p.x, p.y);
  });

  window.addEventListener('mouseup', () => { isPointerDown = false; });

  // Touch controls (kept exactly as original)
  window.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    const t = ev.changedTouches[0];
    const p = toCanvasCoords(t.clientX, t.clientY);
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, p.x));
    throwOrnament(p.x, p.y);
  }, { passive: false });

  window.addEventListener('touchmove', (ev) => {
    ev.preventDefault();
    const t = ev.changedTouches[0];
    const p = toCanvasCoords(t.clientX, t.clientY);
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, p.x));
  }, { passive: false });

  // Keyboard convenience (kept as original)
  window.addEventListener('keydown', (e) => {
    const step = Math.max(8, W * 0.03);
    if (e.key === 'ArrowLeft' || e.key === 'a') player.x -= step;
    if (e.key === 'ArrowRight' || e.key === 'd') player.x += step;
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, player.x));
    if (e.key === ' ' || e.key === 'Enter') {
      throwOrnament(player.x, player.y - H*0.25);
    }
  });

  // Reset button clears ornaments (keeps inputs unchanged)
  resetBtn.addEventListener('click', () => {
    ornaments.length = 0;
    info.textContent = 'Ornaments on tree: 0';
  });

  // Game loop
  let last = performance.now();
  function loop(now) {
    const delta = now - last;
    last = now;
    update(delta);
    render();
    requestAnimationFrame(loop);
  }

  // Init
  resizeCanvas();
  computeLayout();
  player.x = cx;

  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
