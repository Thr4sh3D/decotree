<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Christmas Tree Decorating — Mini Game</title>
<style>
  html,body { height:100%; margin:0; overflow: hidden; }
  body { background:#eaf6ff; /* Ljusblå snöig dag */ display:flex; align-items:stretch; font-family:system-ui, -apple-system, sans-serif; }
  canvas { display:block; width:100%; height:100%; touch-action: none; }
  
  .info {
    position: fixed; left:12px; top:12px;
    background: rgba(255,255,255,0.92); padding:8px 12px; border-radius:20px;
    font-size:16px; font-weight:bold; color:#0b3a4a;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    user-select:none;
    z-index:1001;
    pointer-events: none; /* Låt klick gå igenom */
  }

  /* Glansig röd knapp */
  #resetBtn {
    position: fixed;
    right: 12px;
    top: 12px;
    padding: 10px 18px;
    background: linear-gradient(180deg, #ff5a5a 0%, #d91f2a 60%, #b21016 100%);
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 20px;
    box-shadow: 0 4px 0 #8b0e0e, 0 5px 10px rgba(0,0,0,0.25);
    cursor: pointer;
    user-select: none;
    z-index: 1002; /* Måste ligga överst */
    -webkit-tap-highlight-color: transparent;
  }
  #resetBtn:active { 
    transform: translateY(2px); 
    box-shadow: 0 2px 0 #8b0e0e, 0 2px 5px rgba(0,0,0,0.2); 
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div class="info" id="info">Antal julgranskulor: 0</div>
<button id="resetBtn" ontouchstart="event.stopPropagation()">Rensa Granen</button>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const info = document.getElementById('info');
  const resetBtn = document.getElementById('resetBtn');

  let DPR = Math.max(1, window.devicePixelRatio || 1);

  function resizeCanvas() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
  }

  window.addEventListener('resize', resizeCanvas, { passive: true });

  // Spelvariabler
  let W = innerWidth, H = innerHeight;
  let cx = W/2, cy = H/2;
  let tree = { tiers: [], trunk: {}, width: 0, height: 0 };
  let player = { x:0, y:0, w:80, h:18 };
  const ornaments = [];
  const bullets = [];
  const palette = ['#e63946','#ffb703','#fb8500','#8338ec','#3a86ff','#7bd389','#ff6bcb'];

  // --- BERÄKNA GRANENS FORM ---
  function computeLayout() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    cx = W / 2;
    // Placera granen lite högre upp så stubben syns
    const treeBaseY = H - 100;
    
    // Anpassa storlek
    tree.height = Math.min(H * 0.65, W * 0.85);
    tree.width = tree.height * 0.85;

    // Vi bygger 3 trianglar (Tiers)
    const tiers = [];
    
    // 1. Botten (Störst)
    const h3 = tree.height * 0.45;
    const w3 = tree.width;
    const y3_bottom = treeBaseY;
    const y3_top = treeBaseY - h3;
    
    tiers.push({
      x1: cx, y1: y3_top, 
      x2: cx - w3/2, y2: y3_bottom,
      x3: cx + w3/2, y3: y3_bottom,
      color: '#087023'
    });

    // 2. Mitten
    const h2 = tree.height * 0.45;
    const w2 = tree.width * 0.75;
    // Mitten börjar lite nedanför toppen på botten-lagret (överlapp)
    const y2_bottom = y3_top + (h3 * 0.4); 
    const y2_top = y2_bottom - h2;

    tiers.push({
      x1: cx, y1: y2_top,
      x2: cx - w2/2, y2: y2_bottom,
      x3: cx + w2/2, y3: y2_bottom,
      color: '#0a8a2f'
    });

    // 3. Toppen (Minst)
    const h1 = tree.height * 0.45;
    const w1 = tree.width * 0.5;
    const y1_bottom = y2_top + (h2 * 0.4);
    const y1_top = y1_bottom - h1;

    tiers.push({
      x1: cx, y1: y1_top, // Den absoluta toppen (där stjärnan ska sitta)
      x2: cx - w1/2, y2: y1_bottom,
      x3: cx + w1/2, y3: y1_bottom,
      color: '#0fb24b'
    });

    // Spara ordningen (Toppen sist så den ritas överst)
    tree.tiers = [tiers[0], tiers[1], tiers[2]];

    // Stubben
    const trunkW = tree.width * 0.15;
    const trunkH = 50;
    tree.trunk = { 
        x: cx - trunkW/2, 
        y: treeBaseY, 
        w: trunkW, 
        h: trunkH 
    };

    // Spelaren (Tomten) startar i mitten
    player.w = Math.max(48, W * 0.12);
    player.h = Math.max(12, H * 0.03);
    player.y = H - 60;
    if (!player.x) player.x = cx;
  }

  function clearScreen() {
    ctx.fillStyle = '#eaf6ff';
    ctx.fillRect(0,0,W,H);
  }

  function drawTree() {
    // Rita stubben först
    ctx.fillStyle = '#6b3b1b';
    ctx.fillRect(tree.trunk.x, tree.trunk.y, tree.trunk.w, tree.trunk.h);

    // Rita trianglarna
    for (const t of tree.tiers) {
      // Skugga
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1 + 10);
      ctx.lineTo(t.x2, t.y2 + 10);
      ctx.lineTo(t.x3, t.y3 + 10);
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fill();

      // Själva granen
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1);
      ctx.lineTo(t.x2, t.y2);
      ctx.lineTo(t.x3, t.y3);
      ctx.closePath();
      ctx.fillStyle = t.color;
      ctx.fill();
    }
  }

  // --- MATTE FÖR KOLLISION ---
  function pointInTriangleBarycentric(px, py, tri) {
    const x1 = tri.x1, y1 = tri.y1;
    const x2 = tri.x2, y2 = tri.y2;
    const x3 = tri.x3, y3 = tri.y3;
    const denom = (y2 - y3)*(x1 - x3) + (x3 - x2)*(y1 - y3);
    if (Math.abs(denom) < 1e-9) return false;
    const a = ((y2 - y3)*(px - x3) + (x3 - x2)*(py - y3)) / denom;
    const b = ((y3 - y1)*(px - x3) + (x1 - x3)*(py - y3)) / denom;
    const c = 1 - a - b;
    // Lite marginal så kulan ser ut att sitta "i" granen
    const eps = -0.05; 
    return a >= eps && b >= eps && c >= eps;
  }

  // Rita stjärnan
  function drawStar(x, y, radius = 30, color = '#ffd700') {
    const spikes = 5;
    const outer = radius;
    const inner = radius * 0.5;
    let rot = Math.PI / 2 * 3;
    const cxs = x, cys = y;
    
    ctx.save();
    ctx.shadowColor = 'rgba(255,220,80,0.8)';
    ctx.shadowBlur = 20;
    
    ctx.beginPath();
    ctx.moveTo(cxs, cys - outer);
    for (let i = 0; i < spikes; i++) {
      let x = cxs + Math.cos(rot) * outer;
      let y = cys + Math.sin(rot) * outer;
      ctx.lineTo(x, y);
      rot += Math.PI / spikes;
      x = cxs + Math.cos(rot) * inner;
      y = cys + Math.sin(rot) * inner;
      ctx.lineTo(x, y);
      rot += Math.PI / spikes;
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  // Rita tomten (Samma fina kod som ni hade)
  function drawPlayer() {
    const cxp = player.x;
    const headR = 15;
    const headX = cxp;
    const headY = player.y - 20;

    // Kropp
    ctx.beginPath();
    ctx.fillStyle = '#d92a2a';
    ctx.ellipse(cxp, player.y, 25, 30, 0, Math.PI, 0); // Halvcirkel kropp
    ctx.fill();

    // Huvud
    ctx.beginPath();
    ctx.fillStyle = '#ffd8b6';
    ctx.arc(headX, headY, headR, 0, Math.PI*2);
    ctx.fill();

    // Mössa
    ctx.beginPath();
    ctx.fillStyle = '#d92a2a';
    ctx.moveTo(headX - 15, headY - 5);
    ctx.lineTo(headX + 15, headY - 5);
    ctx.lineTo(headX, headY - 45);
    ctx.fill();

    // Tofs
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(headX, headY - 45, 5, 0, Math.PI*2);
    ctx.fill();

    // Ögon
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(headX - 5, headY - 2, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(headX + 5, headY - 2, 2, 0, Math.PI*2); ctx.fill();
  }

  function drawOrnaments() {
    for (const o of ornaments) {
      // Skapa gradient (glans)
      const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.3, o.r*0.2, o.x, o.y, o.r);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.3, o.color);
      g.addColorStop(1, '#000'); // Lite mörkare kant

      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // --- NY SKJUT-LOGIK: RAKT UPP ---
  function shoot() {
    const speed = 12; // Hastighet uppåt
    const color = palette[Math.floor(Math.random() * palette.length)];
    const r = Math.random() * 5 + 8; // Slumpad storlek (8-13px)

    bullets.push({ 
        x: player.x,      // Startar där tomten står
        y: player.y - 50, // Ovanför mössan
        vx: 0,            // Inget i sidled
        vy: -speed,       // Bara uppåt
        r: r, 
        color: color 
    });
  }

  function update() {
    // Flytta kulor som är i luften
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy;

      let hit = false;
      // Kolla om kulan träffar NÅGON av de tre gröna trianglarna
      for (const t of tree.tiers) {
        if (pointInTriangleBarycentric(b.x, b.y, t)) {
          hit = true;
          break;
        }
      }

      if (hit) {
        // Den träffade! Spara som prydnad och ta bort kulan
        ornaments.push({ x: b.x, y: b.y, r: b.r, color: b.color });
        bullets.splice(i, 1);
        info.textContent = 'Antal julgranskulor: ' + ornaments.length;
      } else if (b.y < -50) {
        // Missade skärmen
        bullets.splice(i, 1);
      }
    }
  }

  function render() {
    clearScreen();
    drawTree();
    
    // Rita stjärnan på toppen av den översta triangeln
    if (tree.tiers.length > 2) {
        const topTri = tree.tiers[2]; // Topp-triangeln ligger sist i listan
        drawStar(topTri.x1, topTri.y1, 35, '#ffd700');
    }

    // Rita kulor som fastnat
    drawOrnaments();
    
    // Rita kulor som flyger
    for (const b of bullets) {
        ctx.beginPath();
        ctx.fillStyle = b.color;
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();
    }

    drawPlayer();
  }

  // --- INPUT (MUS & TOUCH) ---
  function move(x) {
    player.x = x;
    // Håll tomten innanför skärmen
    if (player.x < 30) player.x = 30;
    if (player.x > W - 30) player.x = W - 30;
  }

  // Dator (Mus)
  window.addEventListener('mousemove', e => move(e.clientX));
  window.addEventListener('mousedown', (e) => {
    // Skjut bara om man inte klickar på knappen
    if(e.target.id !== 'resetBtn') shoot();
  });

  // Mobil (Touch)
  window.addEventListener('touchmove', e => {
    move(e.touches[0].clientX);
    e.preventDefault(); // Stoppa scroll
  }, { passive: false });
  
  window.addEventListener('touchstart', (e) => {
    if(e.target.id !== 'resetBtn') {
        move(e.touches[0].clientX); // Flytta tomten dit man trycker
        shoot(); // Och skjut!
    }
  }, { passive: false });

  // Rensa-knappen
  resetBtn.addEventListener('click', () => {
    ornaments.length = 0;
    info.textContent = 'Antal julgranskulor: 0';
  });

  // Starta spelet
  resizeCanvas();
  computeLayout();
  
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
</body>
</html>
