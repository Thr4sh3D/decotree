<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DecoTree - Debug Version</title>
<style>
  /* Enkel setup: Ingen scroll, fullskärm */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #eaf6ff; }
  canvas { display: block; touch-action: none; } /* Stoppa zoom/scroll på mobil */
  
  #ui {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .score-box { background: rgba(255,255,255,0.9); padding: 10px; border-radius: 10px; font-family: sans-serif; font-weight: bold; }
  
  #resetBtn {
    pointer-events: auto; /* Gör knappen klickbar */
    background: #d32f2f; color: white; border: none; padding: 10px 20px;
    font-size: 16px; font-weight: bold; border-radius: 20px;
    box-shadow: 0 4px #b71c1c;
  }
  #resetBtn:active { transform: translateY(2px); box-shadow: 0 2px #b71c1c; }
</style>
</head>
<body>

<div id="ui">
  <div class="score-box" id="score">Antal: 0</div>
  <button id="resetBtn" onclick="resetGame()" ontouchstart="event.stopPropagation()">Rensa</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');

  // Variabler
  let width, height;
  let ornaments = [];
  let bullets = [];
  let tiers = []; // Granens delar
  
  // Spelare
  let player = { x: 0, y: 0 };

  // --- 1. SKÄRM-HANTERING (FÖRENKLAD) ---
  function resize() {
    // Vi tvingar canvasen att vara exakt lika stor som fönstret
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    // Nollställ spelarens position om fönstret ändras
    player.x = width / 2;
    player.y = height - 60;
    
    setupTree();
  }
  window.addEventListener('resize', resize);

  // --- 2. BYGG GRANEN ---
  function setupTree() {
    tiers = [];
    const cx = width / 2;
    const bottomY = height - 120;
    
    // Enklare matte för trianglarna
    const treeH = Math.min(height * 0.6, width * 0.8);
    const treeW = treeH * 0.8;
    
    // Skapa 3 trianglar (Topp, Mitten, Botten)
    // Varje triangel sparas som 3 punkter: {x1,y1, x2,y2, x3,y3}
    
    // Botten
    tiers.push({
      x1: cx, y1: bottomY - treeH * 0.6, 
      x2: cx - treeW/2, y2: bottomY,
      x3: cx + treeW/2, y3: bottomY,
      color: '#087023'
    });
    
    // Mitten
    tiers.push({
      x1: cx, y1: bottomY - treeH * 0.8,
      x2: cx - treeW * 0.35, y2: bottomY - treeH * 0.25,
      x3: cx + treeW * 0.35, y3: bottomY - treeH * 0.25,
      color: '#0a8a2f'
    });

    // Toppen
    tiers.push({
      x1: cx, y1: bottomY - treeH, // Absoluta toppen
      x2: cx - treeW * 0.2, y2: bottomY - treeH * 0.55,
      x3: cx + treeW * 0.2, y3: bottomY - treeH * 0.55,
      color: '#0fb24b'
    });
  }

  // --- 3. KOLLISIONSMATEMATIK ---
  // Kollar om punkt (px, py) är inuti triangeln t
  function isInside(px, py, t) {
    // Barycentric coordinates
    const area = 0.5 * (-t.y2 * t.x3 + t.y1 * (-t.x2 + t.x3) + t.x1 * (t.y2 - t.y3) + t.x2 * t.y3);
    const s = 1 / (2 * area) * (t.y1 * t.x3 - t.x1 * t.y3 + (t.y3 - t.y1) * px + (t.x1 - t.x3) * py);
    const trig = 1 / (2 * area) * (t.x1 * t.y2 - t.y1 * t.x2 + (t.y1 - t.y2) * px + (t.x2 - t.x1) * py);
    const u = 1 - s - trig;
    
    // Om s, trig och u är större än 0, är vi inuti
    return s > 0 && trig > 0 && u > 0;
  }

  // --- 4. INPUT & SKJUTA ---
  function shoot() {
    bullets.push({
      x: player.x,
      y: player.y - 40,
      vx: 0,
      vy: -15, // Snabbare skott
      color: `hsl(${Math.random()*360}, 100%, 50%)`,
      r: 10
    });
  }

  function move(x) {
    player.x = x;
    if(player.x < 0) player.x = 0;
    if(player.x > width) player.x = width;
  }

  // Lyssna på mus/touch
  canvas.addEventListener('mousemove', e => move(e.clientX));
  canvas.addEventListener('mousedown', shoot);
  
  canvas.addEventListener('touchmove', e => {
    move(e.touches[0].clientX);
    e.preventDefault();
  }, {passive: false});
  
  canvas.addEventListener('touchstart', e => {
    if(e.target.tagName !== 'BUTTON') { // Skjut inte om man trycker på knappen
        move(e.touches[0].clientX);
        shoot();
    }
  });

  function resetGame() {
    ornaments = [];
    scoreEl.innerText = "Antal: 0";
  }

  // --- 5. SPEL-LOOP (Update & Draw) ---
  function loop() {
    // Rensa skärmen
    ctx.clearRect(0,0,width,height);

    // Rita Granen
    tiers.forEach(t => {
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1);
      ctx.lineTo(t.x2, t.y2);
      ctx.lineTo(t.x3, t.y3);
      ctx.fill();

      // --- DEBUG: RITA RÖDA LINJER RUNT "HITBOXEN" ---
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    
    // Rita Stjärna (Gul cirkel för nu)
    if(tiers.length > 0) {
        ctx.fillStyle = 'gold';
        ctx.beginPath(); 
        ctx.arc(tiers[2].x1, tiers[2].y1, 15, 0, Math.PI*2); 
        ctx.fill();
    }

    // Uppdatera Skott
    for(let i=bullets.length-1; i>=0; i--) {
      let b = bullets[i];
      b.y += b.vy; // Flytta uppåt

      let hit = false;
      // Kolla alla 3 trianglar
      for(let t of tiers) {
        if(isInside(b.x, b.y, t)) {
           hit = true;
           break;
        }
      }

      if(hit) {
        ornaments.push(b); // Spara som kula
        bullets.splice(i, 1); // Ta bort skottet
        scoreEl.innerText = "Antal: " + ornaments.length;
      } else if (b.y < 0) {
        bullets.splice(i, 1); // Missade
      } else {
        // Rita skottet
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      }
    }

    // Rita fastnade kulor
    ornaments.forEach(o => {
      ctx.fillStyle = o.color;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fill();
      // Vit prick (glans)
      ctx.fillStyle = 'white';
      ctx.beginPath(); ctx.arc(o.x-3, o.y-3, 3, 0, Math.PI*2); ctx.fill();
    });

    // Rita Gubben (Enkel röd cirkel för att utesluta grafikfel)
    ctx.fillStyle = 'red';
    ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, Math.PI*2); ctx.fill();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  loop();

</script>
</body>
</html>
