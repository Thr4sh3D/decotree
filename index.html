<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Christmas Tree Decorating — Mini Game</title>
<style>
  html,body { height:100%; margin:0; }
  body { background:#eaf6ff; /* very light blue - snowy day */ display:flex; align-items:stretch; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  canvas { display:block; width:100%; height:100%; touch-action: none; }
  .info {
    position: fixed; left:12px; top:12px;
    background: rgba(255,255,255,0.92); padding:8px 10px; border-radius:8px;
    font-size:14px; color:#0b3a4a;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    user-select:none;
    z-index:1001;
  }
  /* Glossy red holiday button top-right */
  #resetBtn {
    position: fixed;
    right: 12px;
    top: 12px;
    padding: 8px 14px;
    background: linear-gradient(180deg, #ff5a5a 0%, #d91f2a 60%, #b21016 100%);
    border: 1px solid rgba(0,0,0,0.15);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 18px;
    box-shadow: 0 4px 10px rgba(183, 28, 28, 0.25), inset 0 -2px 0 rgba(0,0,0,0.08);
    cursor: pointer;
    user-select: none;
    z-index: 1000; /* ensure clickable on touch devices */
  }
  #resetBtn:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="info" id="info">Antal julgranskulor: 0</div>
<button id="resetBtn" aria-label="Rensa Granen" ontouchstart="event.stopPropagation()">Rensa Granen</button>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const info = document.getElementById('info');
  const resetBtn = document.getElementById('resetBtn');

  let DPR = Math.max(1, window.devicePixelRatio || 1);

  function resizeCanvas() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    const w = Math.max(300, innerWidth);
    const h = Math.max(300, innerHeight);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
  }

  window.addEventListener('resize', resizeCanvas, { passive: true });

  // Game state
  let W = innerWidth, H = innerHeight;
  let cx = W/2, cy = H/2;
  // tree: tiers array (three triangles) each with explicit x1,y1,x2,y2,x3,y3
  let tree = { tiers: [], trunk: {}, width: 0, height: 0 };
  let player = { x:0, y:0, w:80, h:18 };
  const ornaments = [];
  const palette = ['#e63946','#ffb703','#fb8500','#8338ec','#3a86ff','#7bd389','#ff6bcb'];

  function computeLayout() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    cx = W / 2;
    cy = H / 2.2;
    tree.height = Math.min(H * 0.62, W * 0.62);
    tree.width = tree.height * 0.9;

    // Tier heights
    const h1 = tree.height * 0.28; // top
    const h2 = tree.height * 0.36; // middle
    const h3 = tree.height * 0.36; // bottom

    // Top apex Y
    const topApexY = cy - tree.height * 0.5;

    // Top triangle coordinates
    const top = {
      x1: cx, y1: topApexY,
      x2: cx - tree.width * 0.28, y2: topApexY + h1,
      x3: cx + tree.width * 0.28, y3: topApexY + h1,
      color: '#0fb24b'
    };

    // Middle triangle apex placed to overlap top base
    const overlap = Math.min(h1, h2) * 0.45;
    const midApexY = top.y2 - overlap;
    const middle = {
      x1: cx, y1: midApexY,
      x2: cx - tree.width * 0.45, y2: midApexY + h2,
      x3: cx + tree.width * 0.45, y3: midApexY + h2,
      color: '#0a8a2f'
    };

    // Bottom triangle apex placed to overlap middle base
    const overlap2 = Math.min(h2, h3) * 0.45;
    const botApexY = middle.y2 - overlap2;
    const bottom = {
      x1: cx, y1: botApexY,
      x2: cx - tree.width * 0.6, y2: botApexY + h3,
      x3: cx + tree.width * 0.6, y3: botApexY + h3,
      color: '#087023'
    };

    tree.tiers = [top, middle, bottom];

    // Trunk exactly at bottom base of lowest triangle
    const bottomBaseY = Math.max(bottom.y2, bottom.y3);
    const trunkW = tree.width * 0.16;
    const trunkH = Math.max(24, tree.height * 0.12);
    tree.trunk = { x: cx - trunkW*0.5, y: bottomBaseY, w: trunkW, h: trunkH };

    player.w = Math.max(48, W * 0.12);
    player.h = Math.max(12, H * 0.03);
    player.y = H - player.h - 24;
    if (!player.x) player.x = cx;
  }

  function clearScreen() {
    ctx.fillStyle = '#eaf6ff';
    ctx.fillRect(0,0,W,H);
  }

  function drawTree() {
    // draw subtle shadow below tiers
    for (let t of tree.tiers) {
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1 + 6);
      ctx.lineTo(t.x2, t.y2 + 6);
      ctx.lineTo(t.x3, t.y3 + 6);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fill();
    }

    // draw tiers bottom-to-top for overlap
    for (let i = tree.tiers.length - 1; i >= 0; i--) {
      const t = tree.tiers[i];
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1);
      ctx.lineTo(t.x2, t.y2);
      ctx.lineTo(t.x3, t.y3);
      ctx.closePath();
      ctx.fillStyle = t.color;
      ctx.fill();

      // subtle highlight
      ctx.beginPath();
      const inset = Math.min(tree.width, tree.height) * 0.03;
      ctx.moveTo(t.x1, t.y1 + inset);
      ctx.lineTo(t.x2 + inset, t.y2 - inset);
      ctx.lineTo(t.x3 - inset, t.y3 - inset);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fill();
    }

    // trunk attached to bottom base
    ctx.fillStyle = '#6b3b1b';
    ctx.fillRect(tree.trunk.x, tree.trunk.y, tree.trunk.w, tree.trunk.h);
  }

  // precise barycentric point-in-triangle check using explicit coordinates
  function pointInTriangleBarycentric(px, py, tri) {
    const x1 = tri.x1, y1 = tri.y1;
    const x2 = tri.x2, y2 = tri.y2;
    const x3 = tri.x3, y3 = tri.y3;
    const denom = (y2 - y3)*(x1 - x3) + (x3 - x2)*(y1 - y3);
    if (Math.abs(denom) < 1e-9) return false; // degenerate triangle
    const a = ((y2 - y3)*(px - x3) + (x3 - x2)*(py - y3)) / denom;
    const b = ((y3 - y1)*(px - x3) + (x1 - x3)*(py - y3)) / denom;
    const c = 1 - a - b;
    // allow very small epsilon to tolerate numeric errors and let ornament enter slightly
    const eps = -0.02;
    return a >= eps && b >= eps && c >= eps;
  }

  // star drawing (big and bright)
  function drawStar(x, y, radius = 36, color = '#ffd700') {
    const spikes = 5;
    const outer = radius;
    const inner = radius * 0.48;
    let rot = Math.PI / 2 * 3;
    const cxs = x, cys = y;
    ctx.save();
    ctx.shadowColor = 'rgba(255,220,80,0.95)';
    ctx.shadowBlur = Math.max(12, radius * 1.4);
    ctx.beginPath();
    ctx.moveTo(cxs, cys - outer);
    for (let i = 0; i < spikes; i++) {
      const ox = cxs + Math.cos(rot) * outer;
      const oy = cys + Math.sin(rot) * outer;
      ctx.lineTo(ox, oy);
      rot += Math.PI / spikes;
      const ix = cxs + Math.cos(rot) * inner;
      const iy = cys + Math.sin(rot) * inner;
      ctx.lineTo(ix, iy);
      rot += Math.PI / spikes;
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.arc(cxs, cys, Math.max(3, radius*0.14), 0, Math.PI*2);
    ctx.fill();
  }

  // keep Santa player as before
  function drawPlayer() {
    const cxp = player.x;
    const headR = Math.max(10, player.h * 1.6);
    const headX = cxp;
    const headY = player.y - headR - 6;

    ctx.save();
    // body
    ctx.translate(headX, headY + headR * 0.8);
    const bodyW = player.w * 0.9;
    const bodyH = player.h * 3.6;
    ctx.beginPath();
    ctx.moveTo(-bodyW*0.45, 0);
    ctx.quadraticCurveTo(-bodyW*0.25, bodyH*0.5, 0, bodyH);
    ctx.quadraticCurveTo(bodyW*0.25, bodyH*0.5, bodyW*0.45, 0);
    ctx.closePath();
    ctx.fillStyle = '#d92a2a';
    ctx.fill();
    // trim
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.ellipse(0, bodyH - Math.max(6, player.h*0.3), bodyW*0.45, Math.max(8, player.h*0.45), 0, 0, Math.PI);
    ctx.fill();
    ctx.restore();

    // head
    ctx.beginPath();
    ctx.fillStyle = '#ffd8b6';
    ctx.arc(headX, headY, headR, 0, Math.PI*2);
    ctx.fill();

    // eyes
    ctx.beginPath();
    ctx.fillStyle = '#222';
    ctx.arc(headX - headR*0.28, headY - headR*0.08, Math.max(1.6, headR*0.12), 0, Math.PI*2);
    ctx.arc(headX + headR*0.28, headY - headR*0.08, Math.max(1.6, headR*0.12), 0, Math.PI*2);
    ctx.fill();

    // mouth
    ctx.beginPath();
    ctx.strokeStyle = '#7a2a2a';
    ctx.lineWidth = Math.max(1, headR*0.08);
    ctx.arc(headX, headY + headR*0.12, headR*0.32, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    // hat
    ctx.beginPath();
    ctx.moveTo(headX - headR*0.9, headY - headR*0.6);
    ctx.quadraticCurveTo(headX, headY - headR - headR*0.5, headX + headR*1.1, headY - headR*0.2);
    ctx.lineTo(headX + headR*0.85, headY - headR*0.2);
    ctx.quadraticCurveTo(headX + headR*0.35, headY - headR*0.6, headX - headR*0.6, headY - headR*0.5);
    ctx.closePath();
    ctx.fillStyle = '#d92a2a';
    ctx.fill();

    // hat brim
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.ellipse(headX, headY - headR*0.15, headR*1.02, headR*0.36, 0, 0, Math.PI*2);
    ctx.fill();

    // pompom
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(headX + headR*1.06, headY - headR*0.16, Math.max(4, headR*0.28), 0, Math.PI*2);
    ctx.fill();
  }

  // ornaments with shiny gradient
  function drawOrnaments() {
    for (const o of ornaments) {
      const lx = o.x - o.r*0.35;
      const ly = o.y - o.r*0.45;
      const g = ctx.createRadialGradient(lx, ly, Math.max(1, o.r*0.15), o.x, o.y, o.r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.15, lighten(o.color, 0.25));
      g.addColorStop(0.6, o.color);
      g.addColorStop(1, darken(o.color, 0.25));
      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.arc(lx, ly, Math.max(1.5, o.r*0.28), 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(40,40,40,0.85)';
      ctx.lineWidth = Math.max(1, o.r*0.12);
      ctx.moveTo(o.x, o.y - o.r - 1);
      ctx.lineTo(o.x, o.y - o.r - Math.max(4, o.r*0.6));
      ctx.stroke();
    }
  }

  // small color helpers
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    const bigint = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return { r, g, b };
  }
  function lighten(hex, amt) {
    const c = hexToRgb(hex);
    const r = Math.min(255, Math.round(c.r + (255 - c.r) * amt));
    const g = Math.min(255, Math.round(c.g + (255 - c.g) * amt));
    const b = Math.min(255, Math.round(c.b + (255 - c.b) * amt));
    return `rgba(${r},${g},${b},1)`;
  }
  function darken(hex, amt) {
    const c = hexToRgb(hex);
    const r = Math.max(0, Math.round(c.r * (1 - amt)));
    const g = Math.max(0, Math.round(c.g * (1 - amt)));
    const b = Math.max(0, Math.round(c.b * (1 - amt)));
    return `rgba(${r},${g},${b},1)`;
  }

  // precise barycentric point-in-triangle used for collision
  function pointInTriangleBarycentric(px, py, tri) {
    const x1 = tri.x1, y1 = tri.y1;
    const x2 = tri.x2, y2 = tri.y2;
    const x3 = tri.x3, y3 = tri.y3;
    const denom = (y2 - y3) * (x1 - x3) + (x3 - x2) * (y1 - y3);
    if (Math.abs(denom) < 1e-9) return false; // degenerate
    const a = ((y2 - y3) * (px - x3) + (x3 - x2) * (py - y3)) / denom;
    const b = ((y3 - y1) * (px - x3) + (x1 - x3) * (py - y3)) / denom;
    const c = 1 - a - b;
    // small negative epsilon permits tiny penetration before sticking (visual)
    const eps = -0.02;
    return a >= eps && b >= eps && c >= eps;
  }

  function throwOrnament(targetX, targetY) {
    const originX = player.x;
    const originY = player.y;
    const dx = targetX - originX;
    const dy = targetY - originY;
    const len = Math.hypot(dx, dy) || 1;
    const speed = Math.max(5, Math.min(20, Math.hypot(W,H) / 80));
    const vx = (dx / len) * speed;
    const vy = (dy / len) * speed;
    const color = palette[Math.floor(Math.random() * palette.length)];
    const r = Math.max(6, Math.min(14, Math.round(Math.min(W,H) / 60 * (0.8 + Math.random()*0.6))));
    ornaments.push({ x: originX, y: originY, vx, vy, r, color, stuck: false });
  }

  function pruneOrnaments() {
    for (let i = ornaments.length - 1; i >= 0; i--) {
      const o = ornaments[i];
      if (o.stuck) continue;
      if (o.x < -100 || o.x > W + 100 || o.y < -200 || o.y > H + 200) ornaments.splice(i,1);
    }
  }

  // update loop: check collision against all three tiers using barycentric math
  function update(delta) {
    for (const o of ornaments) {
      if (o.stuck) continue;
      o.x += o.vx * (delta / 16.67);
      o.y += o.vy * (delta / 16.67);

      // Check collision against every green tier (precise geometry)
      let stuckNow = false;
      for (const t of tree.tiers) {
        if (pointInTriangleBarycentric(o.x, o.y, t)) {
          stuckNow = true;
          break;
        }
      }

      if (stuckNow) {
        o.stuck = true;
        o.vx = 0; o.vy = 0;
        // nudge slightly outward from tree center for nicer visual
        const treeCenter = { x: cx, y: cy + tree.height * 0.06 };
        const nx = o.x - treeCenter.x;
        const ny = o.y - treeCenter.y;
        const nlen = Math.hypot(nx, ny) || 1;
        const push = o.r * 0.2;
        o.x += (nx / nlen) * push;
        o.y += (ny / nlen) * push;
      }
    }
    pruneOrnaments();
  }

  function render() {
    clearScreen();
    drawTree();
    // Big bright star at top apex (3x larger than prior base)
    if (tree.tiers && tree.tiers.length > 0) {
      const apex = tree.tiers[0];
      const baseRadius = Math.max(12, tree.width * 0.035);
      drawStar(apex.x1, apex.y1, baseRadius * 3, '#ffd700');
    }
    drawOrnaments();
    drawPlayer();
    info.textContent = 'Antal julgranskulor: ' + ornaments.filter(o => o.stuck).length;
  }

  // coordinate helper
  function toCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width) / DPR;
    const y = (clientY - rect.top) * (canvas.height / rect.height) / DPR;
    return { x, y };
  }

  // Input handlers (preserve behavior). Reset button has ontouchstart to stop propagation.
  let isPointerDown = false;
  window.addEventListener('mousemove', (e) => {
    const p = toCanvasCoords(e.clientX, e.clientY);
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, p.x));
  }, { passive: true });

  window.addEventListener('mousedown', (e) => {
    isPointerDown = true;
    const p = toCanvasCoords(e.clientX, e.clientY);
    throwOrnament(p.x, p.y);
  });

  window.addEventListener('mouseup', () => { isPointerDown = false; });

  window.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    const t = ev.changedTouches[0];
    const p = toCanvasCoords(t.clientX, t.clientY);
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, p.x));
    throwOrnament(p.x, p.y);
  }, { passive: false });

  window.addEventListener('touchmove', (ev) => {
    ev.preventDefault();
    const t = ev.changedTouches[0];
    const p = toCanvasCoords(t.clientX, t.clientY);
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, p.x));
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const step = Math.max(8, W * 0.03);
    if (e.key === 'ArrowLeft' || e.key === 'a') player.x -= step;
    if (e.key === 'ArrowRight' || e.key === 'd') player.x += step;
    player.x = Math.min(W - player.w/2, Math.max(player.w/2, player.x));
    if (e.key === ' ' || e.key === 'Enter') {
      throwOrnament(player.x, player.y - H * 0.25);
    }
  });

  // Reset button clears ornaments
  resetBtn.addEventListener('click', () => {
    ornaments.length = 0;
    info.textContent = 'Antal julgranskulor: 0';
  });

  // Game loop
  let last = performance.now();
  function loop(now) {
    const delta = now - last;
    last = now;
    update(delta);
    render();
    requestAnimationFrame(loop);
  }

  // Init
  resizeCanvas();
  computeLayout();
  player.x = cx;
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
