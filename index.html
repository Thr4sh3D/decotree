<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>DecoTree - Lyxversion</title>
<style>
  html,body { height:100%; margin:0; overflow: hidden; }
  body { background:#eaf6ff; font-family:system-ui, -apple-system, sans-serif; }
  canvas { display:block; width:100%; height:100%; touch-action: none; }
  
  /* UI: Pengar och Info */
  .ui-bar {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  
  .score-box {
    background: rgba(255,255,255,0.95);
    padding: 8px 15px; border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    color: #0b3a4a; font-weight: bold; font-size: 16px;
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: auto;
  }
  
  /* Knappar */
  .btn-group {
    display: flex; flex-direction: column; gap: 10px; pointer-events: auto;
    align-items: flex-end;
  }
  
  button {
    border: none; color: white; font-weight: bold; font-size: 14px;
    padding: 10px 15px; border-radius: 20px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform 0.1s;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

  #resetBtn { background: linear-gradient(to bottom, #ff5f5f, #d32f2f); }
  #shopBtn { background: linear-gradient(to bottom, #4facfe, #00f2fe); color: #005cbf; }

  /* Sound button (now inside btn-group) */
  #soundBtn {
    background: linear-gradient(to bottom, #ffd700, #e8b400); color:#0b3a4a;
    padding: 8px 12px; font-size: 14px; border-radius: 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15); color: #003049;
  }

  /* BUTIK (Modal) */
  #shopModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 100;
    justify-content: center; align-items: center;
  }
  .shop-content {
    background: white; padding: 20px; border-radius: 25px; width: 320px;
    text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  
  .shop-item {
    background: #f0f8ff; margin: 10px 0; padding: 15px; border-radius: 15px;
    display: flex; justify-content: space-between; align-items: center;
    border: 2px solid #e1e1e1;
  }
  .buy-btn {
    background: #28a745; font-size: 12px; padding: 8px 12px; box-shadow: 0 3px 0 #1e7e34;
  }
  .buy-btn:disabled { background: #ccc; box-shadow: none; color: #666; cursor: not-allowed; }
  .close-btn { background: #666; margin-top: 10px; width: 100%; }

</style>
</head>
<body>

<div class="ui-bar">
  <div class="score-box">
    <span id="scoreText">🎄 Kulor: 0</span>
    <span id="moneyText" style="color:#28a745">💰 0 kr</span>
  </div>
  <div class="btn-group">
    <button id="resetBtn" ontouchstart="event.stopPropagation()">Rensa</button>
    <button id="shopBtn" ontouchstart="event.stopPropagation()">🏪 Affär</button>
    <!-- Sound button moved into btn-group -->
    <button id="soundBtn" ontouchstart="event.stopPropagation()">🔊</button>
  </div>
</div>

<div id="shopModal">
  <div class="shop-content">
    <h2 style="margin-top:0; color:#333">Jul-Butiken</h2>
    <p>Köp nya färger & ornament till dina kulor!</p>
    
    <div class="shop-item">
      <div><b>Guld & Silver</b><br><span style="font-size:12px">Glittrande metallic</span></div>
      <button class="buy-btn" id="buyGold" onclick="buyPack('gold', 100)">100 kr</button>
    </div>

    <div class="shop-item">
      <div><b>Diamant</b><br><span style="font-size:12px">Blå/Lila kristaller</span></div>
      <button class="buy-btn" id="buyDiamond" onclick="buyPack('diamond', 500)">500 kr</button>
    </div>

    <hr style="border:none; height:1px; background:#eee; margin:10px 0;">

    <div class="shop-item">
      <div><b>Polkagris</b><br><span style="font-size:12px">Randig polkagris</span></div>
      <button class="buy-btn" id="buyCandy" onclick="buyPack('candy', 50)">50 kr</button>
    </div>

    <div class="shop-item">
      <div><b>Ljusslinga</b><br><span style="font-size:12px">Glittrande ljus</span></div>
      <button class="buy-btn" id="buyLight" onclick="buyPack('light', 150)">150 kr</button>
    </div>

    <div class="shop-item">
      <div><b>Ljus</b><br><span style="font-size:12px">Vitt ljus med låga</span></div>
      <button class="buy-btn" id="buyCandle" onclick="buyPack('candle', 300)">300 kr</button>
    </div>

    <button class="close-btn" onclick="toggleShop(false)">Stäng</button>
  </div>
</div>

<canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  
  // Element
  const scoreText = document.getElementById('scoreText');
  const moneyText = document.getElementById('moneyText');
  const shopModal = document.getElementById('shopModal');
  const soundBtn = document.getElementById('soundBtn');

  // Speldata
  let W, H;
  let money = 0;
  let tree = { tiers: [], trunk: {} };
  let player = { x: 0, y: 0 };
  let ornaments = [];
  let bullets = [];
  let snowflakes = [];
  
  // Färger (Börjar med standard)
  let activePalette = ['#e63946','#d32f2f','#2a9d8f','#e9c46a','#f4a261','#e76f51'];
  
  // Köpta paket / objekt
  let unlocked = { gold: false, diamond: false, candy: false, light: false, candle: false };

  // Active throwing type
  let activeThrowType = 'ball'; // 'ball'|'candy'|'light'|'candle'

  // --- Ljud (Web Audio API, synth) ---
  let audioCtx = null;
  let masterGain = null;
  let noiseBuffer = null;
  let isMuted = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);

    // skapa ett kort vitt brus-buffer
    const sampleRate = audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, sampleRate * 1, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    noiseBuffer = buffer;

    function resumeOnce() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      document.removeEventListener('pointerdown', resumeOnce);
      document.removeEventListener('touchstart', resumeOnce);
    }
    document.addEventListener('pointerdown', resumeOnce);
    document.addEventListener('touchstart', resumeOnce);
  }

  function playSound(type) {
    if (isMuted) return;
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'shoot') {
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2000, now);
      filter.frequency.exponentialRampToValueAtTime(300, now + 0.25);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.6, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      src.connect(filter); filter.connect(g); g.connect(masterGain);
      src.start(now); src.stop(now + 0.35);
    }

    if (type === 'stick') {
      const o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(1500, now);
      o.frequency.exponentialRampToValueAtTime(2200, now + 0.06);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.9, now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.2);
    }

    if (type === 'money') {
      const freqs = [1200, 1600, 2000];
      freqs.forEach((f, i) => {
        const t = now + i * 0.06;
        const o = audioCtx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(f, t);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.6, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + 0.18);
      });
    }

    if (type === 'buy') {
      const chord = [440, 660, 880];
      chord.forEach((f, i) => {
        const o = audioCtx.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f * (1 + (i - 1) * 0.02), now);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.25, now + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
        o.connect(g); g.connect(masterGain);
        o.start(now); o.stop(now + 1.0);
      });
    }
  }

  // Sound button
  soundBtn.onclick = (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    soundBtn.innerText = isMuted ? '🔇' : '🔊';
    if (!isMuted) initAudio();
  };
  soundBtn.ontouchstart = (e) => { e.stopPropagation(); };

  document.addEventListener('pointerdown', () => { try { initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }, { once: true });
  document.addEventListener('touchstart', () => { try { initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }, { once: true });

  // Init
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    player.x = W / 2; player.y = H - 60;
    setupTree();
    if(snowflakes.length === 0) {
      for(let i=0; i<50; i++) snowflakes.push(createSnowflake());
    }
  }
  window.addEventListener('resize', resize);

  // --- LOGIK: GRANEN ---
  function setupTree() {
    const cx = W / 2;
    const bottomY = H - 110;
    const treeH = Math.min(H * 0.65, W * 0.85);
    const treeW = treeH * 0.85;
    tree.tiers = [];

    tree.tiers.push({
      x1: cx, y1: bottomY - treeH * 0.45, 
      x2: cx - treeW/2, y2: bottomY, x3: cx + treeW/2, y3: bottomY,
      color: '#087023'
    });
    const y2_bot = bottomY - treeH * 0.25;
    tree.tiers.push({
      x1: cx, y1: y2_bot - treeH * 0.45,
      x2: cx - treeW * 0.35, y2: y2_bot, x3: cx + treeW * 0.35, y3: y2_bot,
      color: '#0a8a2f'
    });
    const y1_bot = y2_bot - treeH * 0.25;
    tree.tiers.push({
      x1: cx, y1: y1_bot - treeH * 0.45, 
      x2: cx - treeW * 0.2, y2: y1_bot, x3: cx + treeW * 0.2, y3: y1_bot,
      color: '#0fb24b'
    });
    tree.trunk = { x: cx - 20, y: bottomY, w: 40, h: 50 };
  }

  // --- LOGIK: SNÖ ---
  function createSnowflake() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 3 + 1,
      speed: Math.random() * 1 + 0.5,
      wobble: Math.random() * Math.PI * 2
    };
  }
  function updateSnow() {
    snowflakes.forEach(s => {
      s.y += s.speed;
      s.x += Math.sin(s.wobble) * 0.5;
      s.wobble += 0.05;
      if (s.y > H) { s.y = -10; s.x = Math.random() * W; }
    });
  }

  // --- LOGIK: SPEL & FYSIK ---
  function isInside(px, py, t) {
    const area = 0.5 * (-t.y2 * t.x3 + t.y1 * (-t.x2 + t.x3) + t.x1 * (t.y2 - t.y3) + t.x2 * t.y3);
    const s = 1 / (2 * area) * (t.y1 * t.x3 - t.x1 * t.y3 + (t.y3 - t.y1) * px + (t.x1 - t.x3) * py);
    const trig = 1 / (2 * area) * (t.x1 * t.y2 - t.y1 * t.x2 + (t.y1 - t.y2) * px + (t.x2 - t.x1) * py);
    return s > 0 && trig > 0 && (1 - s - trig) > 0;
  }

  function shoot(targetY) {
    const color = (activeThrowType === 'ball') ? activePalette[Math.floor(Math.random() * activePalette.length)]
                  : (activeThrowType === 'candy') ? '#e63946'
                  : (activeThrowType === 'light') ? '#fff'
                  : (activeThrowType === 'candle') ? '#ffffff'
                  : '#fff';
    bullets.push({ 
        x: player.x, y: player.y - 45, targetY: targetY, 
        speed: 15, r: Math.random() * 5 + 8, color: color, type: activeThrowType 
    });
    playSound('shoot');
  }

  function update() {
    updateSnow();
    
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y -= b.speed;
      if (b.y <= b.targetY) {
        let hit = false;
        for (const t of tree.tiers) {
           if (isInside(b.x, b.y, t)) { hit = true; break; }
        }
        if (hit) {
           ornaments.push({x: b.x, y: b.y, r: b.r, color: b.color, type: b.type});
           playSound('stick'); // ornament fästes
           addMoney(1); // Tjäna pengar! (ändrat till 1 kr)
        }
        bullets.splice(i, 1);
      }
    }
    
    scoreText.innerText = '🎄 Kulor: ' + ornaments.length;
    moneyText.innerText = '💰 ' + money + ' kr';
  }

  // --- LOGIK: EKONOMI & BUTIK ---
  function addMoney(amount) {
    money += amount;
    if (amount > 0) playSound('money');
    checkButtons();
    updateShopUI();
  }
  
  window.toggleShop = (show) => {
    shopModal.style.display = show ? 'flex' : 'none';
    checkButtons();
    updateShopUI();
  };
  
  window.buyPack = (type, cost) => {
    // If already unlocked: equip it (for ornament types)
    if (unlocked[type]) {
      // equip ornament types on click; palette items remain non-equipable
      if (['candy','light','candle'].includes(type)) {
        activeThrowType = type;
      }
      updateShopUI();
      return;
    }
    if(money >= cost) {
      money -= cost;
      if(type === 'gold') {
        unlocked.gold = true;
        activePalette.push('#ffd700', '#c0c0c0', '#DAA520', '#E5E4E2');
        document.getElementById('buyGold').innerText = "Köpt!";
        document.getElementById('buyGold').disabled = true;
      }
      else if(type === 'diamond') {
        unlocked.diamond = true;
        activePalette.push('#b9f2ff', '#9b5de5', '#00bbf9', '#fee440');
        document.getElementById('buyDiamond').innerText = "Köpt!";
        document.getElementById('buyDiamond').disabled = true;
      }
      else if(type === 'candy') {
        unlocked.candy = true;
        activeThrowType = 'candy';
      }
      else if(type === 'light') {
        unlocked.light = true;
        activeThrowType = 'light';
      }
      else if(type === 'candle') {
        unlocked.candle = true;
        activeThrowType = 'candle';
      }
      playSound('buy');
      checkButtons();
      updateShopUI();
    }
  };

  function checkButtons() {
    const goldBtn = document.getElementById('buyGold');
    const diamondBtn = document.getElementById('buyDiamond');
    const candyBtn = document.getElementById('buyCandy');
    const lightBtn = document.getElementById('buyLight');
    const candleBtn = document.getElementById('buyCandle');

    if(unlocked.gold) { goldBtn.disabled = true; } else goldBtn.disabled = (money < 100);
    if(unlocked.diamond) { diamondBtn.disabled = true; } else diamondBtn.disabled = (money < 500);

    // Ornament items: if unlocked keep enabled (so player can equip), else disable if no money
    candyBtn.disabled = unlocked.candy ? false : (money < 50);
    lightBtn.disabled = unlocked.light ? false : (money < 150);
    candleBtn.disabled = unlocked.candle ? false : (money < 300);
  }

  function updateShopUI() {
    const mapping = [
      {id:'buyCandy', type:'candy', price:50, label:'Polkagris'},
      {id:'buyLight', type:'light', price:150, label:'Ljusslinga'},
      {id:'buyCandle', type:'candle', price:300, label:'Ljus'}
    ];
    mapping.forEach(it => {
      const btn = document.getElementById(it.id);
      if (!btn) return;
      if (unlocked[it.type]) {
        btn.innerText = (activeThrowType === it.type) ? 'Aktiv' : 'Ägd';
        btn.style.background = (activeThrowType === it.type) ? '#ffd54d' : '#28a745';
      } else {
        btn.innerText = it.price + ' kr';
        btn.style.background = '#28a745';
      }
    });
  }

  // --- RITA ALLT ---
  function draw() {
    ctx.fillStyle = '#eaf6ff'; ctx.fillRect(0,0,W,H); // Himmel

    // Snö
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    snowflakes.forEach(s => {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });

    // Gran
    ctx.fillStyle = '#6b3b1b'; ctx.fillRect(tree.trunk.x, tree.trunk.y, tree.trunk.w, tree.trunk.h);
    tree.tiers.forEach(t => {
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.lineTo(t.x3, t.y3); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.moveTo(t.x1, t.y1+8); ctx.lineTo(t.x2, t.y2+8); ctx.lineTo(t.x3, t.y3+8); ctx.fill();
    });

    if(tree.tiers.length){
        const top = tree.tiers[2];
        ctx.fillStyle = '#ffd700'; ctx.shadowBlur = 25; ctx.shadowColor = 'gold';
        ctx.beginPath(); ctx.arc(top.x1, top.y1, 15, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Rita ornament och skott (skott syns i bullets)
    ornaments.forEach(o => drawOrnament(o));
    bullets.forEach(b => drawOrnament(b));

    drawSanta(player.x, player.y);
  }

  function drawOrnament(o) {
    const type = o.type || 'ball';
    if (type === 'ball') {
      const g = ctx.createRadialGradient(o.x-o.r*0.3, o.y-o.r*0.3, 1, o.x, o.y, o.r);
      g.addColorStop(0, '#fff'); g.addColorStop(0.3, o.color); g.addColorStop(1, '#222');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fill();
      // small shine
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(o.x - o.r*0.4, o.y - o.r*0.4, o.r*0.25, 0, Math.PI*2); ctx.fill();
    }
    else if (type === 'candy') {
      // draw candy as small circle with stripes
      const r = o.r;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate((o.x+o.y)%6 / 6);
      // white base
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, r*1.1, r*0.9, 0, 0, Math.PI*2); ctx.fill();
      // red stripes
      ctx.strokeStyle = '#e63946'; ctx.lineWidth = Math.max(2, r*0.4);
      for (let i=-2; i<=2; i++) {
        ctx.beginPath(); ctx.ellipse(i * r*0.18, 0, r*0.5, r*0.45, 0, 0, Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
    else if (type === 'light') {
      // bulb with glow
      ctx.save();
      ctx.beginPath();
      ctx.shadowColor = 'rgba(255, 230, 120, 0.8)';
      ctx.shadowBlur = 20;
      ctx.fillStyle = o.color || '#fff';
      ctx.ellipse(o.x, o.y, o.r*0.9, o.r*1.2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // screw base
      ctx.fillStyle = '#666'; ctx.fillRect(o.x - o.r*0.5, o.y + o.r*1.05, o.r, o.r*0.3);
      ctx.restore();
    }
    else if (type === 'candle') {
      // candle body
      const w = o.r * 0.8;
      const h = o.r * 2.0;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.rect(o.x - w/2, o.y - h, w, h); ctx.fill();
      // flame
      ctx.beginPath();
      ctx.fillStyle = '#ffd54d';
      ctx.ellipse(o.x, o.y - h - (o.r*0.3), w*0.4, h*0.35, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ff8f00';
      ctx.beginPath(); ctx.ellipse(o.x, o.y - h - (o.r*0.25), w*0.25, h*0.2, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawSanta(x, y) {
    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffccb0'; ctx.beginPath(); ctx.arc(x, y-22, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.moveTo(x-16, y-28); ctx.lineTo(x+16, y-28); ctx.lineTo(x, y-55); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y-55, 6, 0, Math.PI*2); ctx.fill();
  }

  // --- INPUT ---
  function move(x) { player.x = Math.max(30, Math.min(W-30, x)); }
  
  window.addEventListener('mousemove', e => move(e.clientX));
  window.addEventListener('mousedown', e => {
     if(e.target.tagName !== 'BUTTON') shoot(e.clientY);
  });

  window.addEventListener('touchmove', e => {
     move(e.touches[0].clientX); e.preventDefault();
  }, {passive: false});
  
  window.addEventListener('touchstart', e => {
     if(e.target.tagName !== 'BUTTON' && !shopModal.contains(e.target)) {
        move(e.touches[0].clientX); shoot(e.touches[0].clientY);
        e.preventDefault(); // <- BUG FIX: stoppa ghost mousedown (måste vara direkt efter shoot)
     }
  }, {passive: false});

  // Koppla knappar
  document.getElementById('resetBtn').onclick = () => { ornaments=[]; bullets=[]; money=0; addMoney(0); activeThrowType='ball'; updateShopUI(); };
  document.getElementById('shopBtn').onclick = () => toggleShop(true);

  // Start
  resize();
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();

})();
</script>
</body>
</html>
